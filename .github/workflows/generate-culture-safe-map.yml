name: CultureSafeMap HTML·한글 공문 갱신

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/**
      - .github/workflows/generate-culture-safe-map.yml

permissions:
  contents: write

concurrency:
  group: culture-safe-map-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - name: 승인 템플릿과 코드 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Python 준비
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: 판단 코드 실행 준비
        run: python -m pip install -r automation/requirements.txt

      - name: 최신 CSV 읽기·공문 판단·HTML 생성
        run: python automation/build_dashboard.py

      - name: 접속 시 CSV 로딩·화면 보존·한글 생성 검사
        run: node automation/test_dashboard.cjs index.html .culture-safe-map-build/source

      - name: 생성 결과 내려받기 파일 보관
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CultureSafeMap-HTML-HWPX
          path: |
            .culture-safe-map-build/output/index.html
            .culture-safe-map-build/output/sample_notice.hwpx
            .culture-safe-map-build/output/build_report.json
            .culture-safe-map-build/output/행사별_공문대상_요약.csv
            .culture-safe-map-build/output/행사_감염병_전체판단.csv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: index.html만 반영·기존 Cloudflare 자동배포 연결
        shell: bash
        run: |
          git config user.name "CultureSafeMap Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "내용 변경 없음: 기존 배포 유지"
          else
            git commit -m "CultureSafeMap HTML·한글 공문 데이터 갱신"
            git push origin HEAD:main
          fi
